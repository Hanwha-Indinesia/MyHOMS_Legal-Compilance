<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F37321">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HMSI-LCMS">
  <title>HMSI Legal Compliance Management System</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=account_balance,account_tree,add,add_circle,apartment,archive,arrow_back,arrow_forward,arrow_right,assignment,assignment_late,attach_file,auto_awesome,autorenew,badge,bar_chart,block,calendar_month,campaign,cancel,cards,check,check_circle,checklist,chevron_left,chevron_right,close,cloud_done,cloud_off,cloud_upload,content_copy,dashboard,delete,description,difference,domain,donut_large,download,edit,edit_note,email,error,event,expand_less,expand_more,fact_check,filter_alt_off,folder_open,function,gavel,grid_view,group,help,hide,history,hourglass_empty,hourglass_top,image,inbox,info,input,insights,install_mobile,inventory_2,key,link,location_on,lock,lock_open,lock_reset,logout,mail,manage_accounts,manage_search,mark_email_read,menu,menu_book,monitor_heart,network_check,new_releases,notifications,notifications_active,open_in_new,password,pending_actions,person,person_add,picture_as_pdf,policy,priority_high,public,public_off,published_with_changes,radio,radio_button_unchecked,refresh,rule,save,schedule,search,search_off,select,sell,send,settings,shield,shield_lock,smart_toy,support_agent,sync,table_view,task,task_alt,timer,token,travel_explore,trending_down,trending_up,tune,unarchive,undo,verified,verified_user,visibility,visibility_off,warning,workspace_premium&display=block" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Loader awal (hanya tampil < 1 detik saat shell dimuat) -->
  <div id="boot" role="status" aria-live="polite">
    <div class="lg">HMSI</div>
    <div class="spin"></div>
    <div class="muted small">Memuat HMSI-LCMS…</div>
  </div>

  <!-- Layar autentikasi: login, akun terkunci, sesi berakhir, ganti PIN wajib -->
  <div id="auth"></div>

  <!-- Shell aplikasi SPA -->
  <div id="app">
    <aside class="sb" id="sb" aria-label="Navigasi utama">
      <div class="sb-h">
        <div class="sb-logo" id="sbLogo">HMSI</div>
        <div><div class="sb-nm" id="sbNama">HMSI-LCMS</div><div class="sb-sub">Legal Compliance</div></div>
      </div>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-f">
        <div class="av" id="sbAv">–</div>
        <div class="sb-u"><b id="sbUNama">–</b><span id="sbUNrp">NRP –</span><em id="sbURole">–</em></div>
        <button class="btn gh ic sm" data-act="logout" title="Keluar" aria-label="Keluar"><span class="ms">logout</span></button>
      </div>
      <div class="sb-ver" id="sbVer" aria-label="Versi aplikasi">MyHOMS versi</div>
    </aside>
    <div class="ovl-sb" id="ovlsb" data-act="sb-close"></div>

    <div class="main">
      <header class="tb">
        <button class="btn gh ic tb-menu" data-act="sb-open" aria-label="Buka menu"><span class="ms">menu</span></button>
        <div class="tb-crumb"><span class="hm">SHEC Corporate&nbsp;/&nbsp;</span><b id="tbTitle">Dashboard</b></div>
        <div class="sp"></div>
        <span class="sync-dot hide" id="syncDot" title="Status sinkronisasi"><i></i><span id="syncTx">Tersinkron</span></span>
        <label class="sitesel" title="Filter site global">
          <span class="ms s muted">location_on</span>
          <span class="sr">Filter site</span>
          <select id="siteSel" data-ch="site-global" aria-label="Filter site"></select>
        </label>
        <button class="btn gh ic hide" id="pwaInstal" type="button" title="Pasang aplikasi di perangkat ini" aria-label="Pasang aplikasi di perangkat ini"><span class="ms">install_mobile</span></button>
        <button class="btn gh ic bell" data-act="notif" aria-label="Notifikasi"><span class="ms">notifications</span><span class="dot hide" id="bellDot"></span></button>
        <button class="tb-u" data-act="umenu" aria-label="Menu pengguna">
          <div class="av s" id="tbAv">–</div>
          <div class="tbx"><b id="tbUNama">–</b><em id="tbURole">–</em></div>
          <span class="ms s muted tbx">expand_more</span>
        </button>
      </header>

      <main class="content" id="content">
        <section class="sec" id="sec-dashboard"></section>
        <section class="sec" id="sec-pencarian"></section>
        <section class="sec" id="sec-verifikasi"></section>
        <section class="sec" id="sec-reg1"></section>
        <section class="sec" id="sec-reg1d"></section>
        <section class="sec" id="sec-reg2"></section>
        <section class="sec" id="sec-reg2d"></section>
        <section class="sec" id="sec-evaluasi"></section>
        <section class="sec" id="sec-evalform"></section>
        <section class="sec" id="sec-laporan"></section>
        <section class="sec" id="sec-pengaturan"></section>
        <section class="sec" id="sec-audit"></section>
      </main>
    </div>
  </div>

  <div id="mroot"></div>
  <div id="croot"></div>
  <div id="droot"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="./js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" defer></script>
  <script src="./js/pwa.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
